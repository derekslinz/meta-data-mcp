[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-data-mcp"
dynamic = ["version"]
description = "MCP server exposing 60+ open data providers to LLM clients via intelligent metadata routing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Derek Linz", email = "derek.s.linz@gmail.com" },
]
keywords = [
    "mcp",
    "open-data",
    "llm",
    "ai",
    "claude",
    "metadata",
    "routing",
    "data-discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "anyio>=4.0.0",
    "click>=8.1.7",
    "cryptography>=48.0.1",
    "httpx>=0.28.0",
    "h11>=0.16.0",
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.urls]
Homepage = "https://github.com/derekslinz/meta-data-mcp"
Repository = "https://github.com/derekslinz/meta-data-mcp"
"Bug Tracker" = "https://github.com/derekslinz/meta-data-mcp/issues"

[tool.hatch.version]
path = "meta_data_mcp/__init__.py"

[project.scripts]
meta-data-mcp = "meta_data_mcp.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
include = ["meta_data_mcp", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest>=9.0.3",
    "ruff>=0.8.1",
    "pre-commit>=4.0.1",
]
smoke = [
    "pytest>=9.0.3",
    "playwright>=1.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q -m 'not live and not smoke'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "live: marks tests as live integration tests that make real HTTP calls (deselected by default; run with -m live)",
    "smoke: marks tests as headless-browser smoke tests for ui:// bundles (deselected by default; run with -m smoke + the 'smoke' dependency group + Playwright browsers installed)",
]


[tool.hatch.build]
packages = ["meta_data_mcp"]
