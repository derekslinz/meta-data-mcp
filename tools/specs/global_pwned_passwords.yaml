id: global_pwned_passwords
server_name: global-pwned-passwords
title: Pwned Passwords
base_url: https://api.pwnedpasswords.com
description: "Have I Been Pwned Pwned Passwords range API for anonymous SHA-1 prefix lookups."
homepage: https://haveibeenpwned.com/API/v3#SearchingPwnedPasswordsByRange
domains:
- security
regions:
- global
keywords:
- pwned passwords
- have i been pwned
- breach
- password
- k-anonymity
- sha1
- security
tools:
- name: pwned-passwords-range
  description: Look up breached-password hash suffixes for a 5-character SHA-1 prefix using k-anonymity.
  endpoint: /range/{sha1_prefix}
  response_format: text
  params:
  - name: sha1_prefix
    type: str
    required: true
    description: First 5 hexadecimal characters of a SHA-1 password hash.
