repos:
- repo: local
  hooks:
    - id: sync-docs
      name: Sync provider count and version across docs
      entry: uv run python tools/sync_docs.py
      language: system
      pass_filenames: false
      always_run: true

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.8
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]