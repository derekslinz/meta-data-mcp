name: Release

# Two entry points:
# - `release: published` — a human creates a GitHub Release by hand
#   (the historical flow; still works).
# - `workflow_call` — invoked by auto-release.yml after it cuts a
#   release for a version bump on main. This path exists because a
#   release created with the workflow's own GITHUB_TOKEN does NOT emit
#   a `release: published` event (GitHub's recursion guard), so the
#   publish must be chained explicitly.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v3.1.0)"
        required: true
        type: string

env:
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed for PyPI trusted publishing
      id-token: write
      # Needed for uploading to GitHub releases
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --no-dev
          uv build

      - name: Check version matches tag
        run: |
          PKG_VERSION=$(uv run python -c "from meta_data_mcp import __version__; print(__version__)")
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION=${TAG#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Package version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
